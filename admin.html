<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>لوحة إدارة Omar Tareeq</title>
<meta name="theme-color" content="#ffffff" />
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<style>
  /* admin-only tweaks, kept minimal and in its own block so style.css stays shared with the student site */
  body{ padding-bottom:0 !important; }
  .site-header{ justify-content:flex-start; }
  .admin-shell{ max-width:1100px; margin:0 auto; padding:24px 20px 60px; }
  .admin-title-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .admin-title-row h1{ font-family:var(--font-display); font-weight:700; font-size:22px; margin:0; }
  .students-search{ margin-bottom:14px; }
  .students-search input{ width:100%; border:1px solid var(--line); border-radius:10px; padding:11px 14px; font-size:14.5px; background:var(--surface-2); }
  .students-search input:focus{ outline:none; border-color:var(--accent); background:#fff; }

  /* mobile consistency for the admin panel */
  @media (max-width: 640px){
    .admin-shell{ padding:16px 14px 50px; }
    .admin-title-row h1{ font-size:19px; }
    .tabs{ gap:2px; }
    .tab-btn{ padding:9px 10px; font-size:13px; }
    .row-item{ flex-direction:column; align-items:flex-start !important; gap:8px; }
    .row-actions{ width:100%; flex-wrap:wrap; }
    .row-actions .chip-btn{ flex:1 1 auto; text-align:center; }
    .option-row{ flex-wrap:wrap; }
    .option-row input[type="file"]{ width:100% !important; }
    .option-row input[type="text"]{ min-width:0; }
  }
</style>
</head>
<body>

<div id="app-loader" class="app-loader">
  <div class="loader-mark"><span style="font-family:var(--font-display);font-weight:700;font-size:15px">Omar Tareeq</span></div>
</div>

<header class="site-header">
  <div class="brand-mark" aria-label="Omar Tareeq"><span style="font-family:var(--font-display);font-weight:700;font-size:15px">لوحة الإدارة</span></div>
  <div class="header-spacer"></div>
  <div class="header-actions" id="headerActions">
    <span id="headerUserBox"></span>
    <button class="chip-btn" id="logoutBtn">خروج</button>
  </div>
</header>

<main id="auth-view" class="auth-view">

  <section class="auth-card" id="loginCard">
    <h1 class="auth-title">دخول الفريق</h1>
    <p class="auth-sub">لوحة الإدارة لأعضاء الفريق فقط</p>
    <form id="loginForm" class="auth-form" novalidate>
      <label class="field"><span>البريد الإلكتروني</span><input id="loginEmail" type="email" required /></label>
      <label class="field"><span>كلمة المرور</span><input id="loginPassword" type="password" required /></label>
      <button type="button" class="link-btn" id="forgotPassBtn">نسيت كلمة المرور؟</button>
      <button type="submit" class="primary-btn">دخول</button>
    </form>
    <p class="auth-switch">عضو جديد في الفريق؟ <button type="button" class="link-btn strong" id="goSignup">إنشاء حساب</button></p>
  </section>

  <section class="auth-card hidden" id="signupCard">
    <h1 class="auth-title">حساب فريق جديد</h1>
    <p class="auth-sub">محتاج رمز دعوة من صاحب المنصة</p>
    <form id="signupForm" class="auth-form" novalidate>
      <label class="field"><span>الاسم كاملًا</span><input id="suFullName" type="text" required /></label>
      <label class="field"><span>البريد الإلكتروني</span><input id="suEmail" type="email" required /></label>
      <label class="field"><span>كلمة المرور</span><input id="suPassword" type="password" required minlength="6" /></label>
      <label class="field"><span>رمز الدعوة</span><input id="suInvite" type="password" required /></label>
      <button type="submit" class="primary-btn">إنشاء الحساب</button>
    </form>
    <p class="auth-switch">عندك حساب بالفعل؟ <button type="button" class="link-btn strong" id="goLogin">تسجيل الدخول</button></p>
  </section>

  <section class="auth-card hidden" id="forgotCard">
    <h1 class="auth-title">استعادة كلمة المرور</h1>
    <p class="auth-sub">هنبعتلك رابط تفعيل على بريدك الإلكتروني</p>
    <form id="forgotForm" class="auth-form" novalidate>
      <label class="field"><span>البريد الإلكتروني</span><input id="forgotEmail" type="email" required /></label>
      <button type="submit" class="primary-btn">إرسال رابط الاستعادة</button>
    </form>
    <p class="auth-switch"><button type="button" class="link-btn strong" id="backToLogin">رجوع لتسجيل الدخول</button></p>
  </section>

  <div id="authMsg" class="auth-msg" role="status" aria-live="polite"></div>
</main>

<div class="admin-shell hidden" id="adminShell">
  <div class="admin-title-row"><h1>لوحة الإدارة</h1></div>
  <div class="tabs" id="adminTabs"></div>
  <div id="adminPane"></div>
</div>

<script type="module" src="admin.js"></script>
</body>
</html>
